[package]
name = "campus-desktop"
version = "1.0.0"
description = "Campus Management System Desktop Host"
authors = ["Deepmind Team"]
edition = "2021"

[lib]
name = "campus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
